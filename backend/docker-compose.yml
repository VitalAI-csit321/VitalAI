services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalai
      POSTGRES_PASSWORD: vitalai
      POSTGRES_DB: vitalai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalai"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # quay.io/minio/minio refuses anonymous pulls; CI and the deployment
    # stack use this image too.
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    ports:
      # Host port 9002, not 9000: 9000 is often taken by another local
      # service (a Hadoop NameNode here silently corrupted uploads through
      # it). Compose-internal traffic still uses minio:9000.
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      # .env's DATABASE_URL and MINIO_ENDPOINT point at 127.0.0.1 for the
      # host-venv workflow. Inside this container 127.0.0.1 is the container
      # itself, not the db/minio containers, so both fail with connection
      # refused. Override with the compose service hostnames so the container
      # works regardless of how .env is currently set for host use.
      DATABASE_URL: postgresql+asyncpg://vitalai:vitalai@db:5432/vitalai
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # -1 = never unload the model on idle. Default 5m unload means every
      # gap between requests pays a multi-second reload cost from disk,
      # which was eating most of the client's own request timeout.
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  ollama_data:
