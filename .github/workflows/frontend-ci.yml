name: Frontend CI

# Deliberately no `paths:` filter. A path-filtered workflow never runs on a PR
# that misses the filter, so it never reports a status, and a branch protection
# rule that requires it would block such PRs forever waiting on a check that can
# never arrive. This job is under a minute and Actions minutes are free on public
# repos, so always running it is cheaper than the machinery to work around that.
on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop, staging]

# Lint and build need to read the repo and nothing else.
permissions:
  contents: read

# Supersede an in-flight run when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Kept in sync with frontend/frontend/.nvmrc so CI and local match.
          node-version-file: frontend/frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check and build
        # "build" is `tsc -b && vite build`, so this covers type checking too.
        # Verified that tsc -b still reports errors despite the committed
        # tsconfig.tsbuildinfo, so no --force is needed here.
        run: npm run build
